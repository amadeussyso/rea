name: Sync Upstream

on:
  schedule:
    - cron: "0 0 * * *" # 每天同步一次
  workflow_dispatch: # 支持手动点击同步

jobs:
  sync_with_upstream:
    runs-on: ubuntu-latest
    name: Sync with Upstream

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Sync Upstream
        uses: aormsby/Action-Sync-Branch@v1.5.0
        with:
          owner: morluto         # 上游仓库的作者名
          repo: rea              # 上游仓库名
          base_ref: main         # 上游的分支
          head_ref: main         # 你仓库的分支
          service_token: ${{ secrets.GITHUB_TOKEN }}
